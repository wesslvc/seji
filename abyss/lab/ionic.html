<!doctype html>
<html lang="ko" mode="ios">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>순위 도감 · Ionic 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.5/css/ionic.bundle.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.5/css/palettes/dark.class.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.5/dist/ionic/ionic.esm.js"></script>
<link rel="stylesheet" href="lab.css">
<style>
  :root{--ion-font-family:'Pretendard',system-ui,sans-serif}
  body{background:var(--ion-background-color,#f2f2f7);color:var(--ion-text-color);font-family:var(--ion-font-family)}
  html:not(.ion-palette-dark) body{background:#f2f2f7}
  ion-toolbar{--background:var(--ion-card-background,#fff)}
  .top{display:flex;align-items:center;gap:.6rem;padding:.4rem 1rem;background:var(--ion-card-background,#fff);border-bottom:.5px solid var(--ion-border-color,#c8c7cc)}
  .top b{font-size:1.1rem;letter-spacing:-.01em}.top .sp{flex:1}
  .lab-lead{color:var(--ion-color-step-600,#666);opacity:1}
  #cats{flex-wrap:wrap}
  ion-chip{--background:var(--ion-card-background,#fff);cursor:pointer;margin:0;font-size:.9rem;font-weight:500}
  ion-chip.on{--background:var(--ion-color-primary);--color:#fff}
  .lab-side{padding:0}
  .lab-side ion-list{border-radius:18px;margin:0;padding:.3rem 0}
  .lab-side ion-list-header{font-size:.78rem;font-weight:600;letter-spacing:.02em;color:var(--ion-color-step-600,#666);min-height:32px;padding-top:8px}
  .lab-side ion-item{--min-height:44px;cursor:pointer}
  .lab-side ion-item.on{--background:rgba(var(--ion-color-primary-rgb),.14);--color:var(--ion-color-primary);font-weight:600}
  .lab-reg ion-card{margin:0;border-radius:18px;height:100%;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 22px -14px rgba(0,0,0,.25)}
  .lab-reg.on ion-card{outline:2px solid var(--ion-color-primary);outline-offset:-2px}
  .lab-reg ion-card-content{padding:14px 16px}
  .lab-reg .k{display:flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--ion-color-step-600,#666)}
  .lab-reg .dot{width:.6rem;height:.6rem;border-radius:50%}
  .lab-reg .v{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;color:#111;margin:.1rem 0}
  html.ion-palette-dark .lab-reg .v{color:#f5f5f7}
  .tblbox{background:var(--ion-card-background,#fff);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 22px -14px rgba(0,0,0,.25)}
  .lab-tbl th{font-size:.82rem;font-weight:600;color:var(--ion-color-step-600,#666);text-align:left;padding:.9rem 1rem;border-bottom:.5px solid var(--ion-border-color,#c8c7cc)}
  .lab-tbl td{padding:.7rem 1rem;border-bottom:.5px solid var(--ion-border-color,#e5e5ea)}
  .lab-tbl tbody tr:last-child td{border-bottom:0}
  ion-progress-bar{--buffer-background:var(--ion-color-step-150,#e5e5ea);--progress-background:var(--c,var(--ion-color-primary));height:8px;border-radius:999px}
  .src{padding:.15rem .7rem;border-radius:999px;background:var(--ion-color-step-100,#e9e9ee);font-size:.8rem;color:var(--ion-color-step-600,#666)}
</style>
</head>
<body>
<div class="top">
  <b>Geogl3 Abyss</b><ion-badge color="primary">Ionic 시안</ion-badge><span class="sp"></span>
  <ion-button size="small" fill="clear" href="index.html">다른 시안 보기</ion-button>
  <ion-toggle id="theme" aria-label="다크"></ion-toggle>
</div>
<main class="lab-wrap">
  <h1>순위 도감</h1>
  <p class="lab-lead">항목마다 자료를 가진 나라를 끝까지 줄 세웁니다. 대륙 카드를 누르면 그 대륙만 남습니다.</p>
  <div id="cats" class="lab-chips"></div>
  <div class="lab-grid">
    <aside class="lab-side" id="metrics"></aside>
    <section id="view"></section>
  </div>
</main>
<script src="../js/data.js"></script>
<script src="../js/dict-data.js"></script>
<script src="../js/climate-data.js"></script>
<script src="../js/rivers-data.js"></script>
<script src="../js/borders-data.js"></script>
<script src="../js/terr-data.js"></script>
<script src="../js/world-data.js"></script>
<script src="../js/labels.js"></script>
<script src="../js/stat-data.js"></script>
<script src="lab.js"></script>
<script src="../js/derive.js"></script>
<script>
function render(){
  const cats=[['','전체']].concat(labCats().map(c=>[c,c]));
  document.getElementById('cats').innerHTML=cats.map(([k,n])=>
    '<ion-chip class="'+(LAB.cat===k?'on':'')+'" data-c="'+abEsc(k)+'"><ion-label>'+abEsc(n)+'</ion-label></ion-chip>').join('');
  let h='<ion-list inset="false" lines="none">',cur='';
  labMetrics().forEach(m=>{
    if(m.cat!==cur){cur=m.cat;h+='<ion-list-header><ion-label>'+abEsc(cur)+'</ion-label></ion-list-header>';}
    h+='<ion-item button detail="false" class="'+(m.id===LAB.id?'on':'')+'" data-id="'+abEsc(m.id)+'"><ion-label>'+abEsc(m.name)
      +'</ion-label><ion-note slot="end">'+abRank(m.id).length+'</ion-note></ion-item>';
  });
  document.getElementById('metrics').innerHTML=h+'</ion-list>';
  const d=labData();
  let v='<div class="lab-head"><h2>'+abEsc(d.m.name)+'</h2><span class="src">'+abEsc(d.m.src)+' · '+d.total+'개국</span></div>';
  if(d.m.note)v+='<p class="lab-note">'+abEsc(d.m.note)+'</p>';
  v+='<div class="lab-regions">'+d.cards.map(c=>
    '<div role="button" tabindex="0" class="lab-reg'+(c.on?' on':'')+'" data-cont="'+c.k+'"'+(c.off?' aria-disabled="true"':'')+'><ion-card><ion-card-content>'
    +'<div class="k">'+(c.color?'<span class="dot" style="background:'+c.color+'"></span>':'')+abEsc(c.name)+'</div>'
    +'<div class="v">'+abEsc(c.val)+'</div><div class="s">'+abEsc(c.sub)+'</div></ion-card-content></ion-card></div>').join('')+'</div>';
  v+='<div class="tblbox lab-scroll"><table class="lab-tbl"><thead><tr>'
    +'<th>순위</th><th>나라</th><th style="text-align:right">'+abEsc(d.m.unit||'')+'</th><th class="bar"></th></tr></thead><tbody>'
    +d.rows.map(r=>'<tr><td>'+(r.rank<=3?'<ion-badge color="primary">'+r.rank+'</ion-badge>':r.rank)+'</td>'
      +'<td class="nm"><a href="../index.html#/atlas?'+r.iso+'">'+abFlag(r.iso,20)+abEsc(r.name)+'</a></td>'
      +'<td class="val">'+abEsc(r.val)+'</td>'
      +'<td class="bar"><ion-progress-bar style="--c:'+r.color+'" value="'+(r.pct/100).toFixed(3)+'"></ion-progress-bar></td></tr>').join('')
    +'</tbody></table></div>';
  document.getElementById('view').innerHTML=v;
}
document.addEventListener('click',e=>{
  const c=e.target.closest('#cats [data-c]');if(c){LAB.cat=c.dataset.c;render();return;}
  const m=e.target.closest('#metrics [data-id]');if(m){LAB.id=m.dataset.id;render();return;}
  const r=e.target.closest('.lab-reg');if(r&&r.getAttribute('aria-disabled')!=='true'){LAB.cont=r.dataset.cont;render();}
});
document.getElementById('theme').addEventListener('ionChange',e=>document.documentElement.classList.toggle('ion-palette-dark',e.detail.checked));
const q=location.hash.replace('#','');if(q&&AB_METRICS.some(m=>m.id===q))LAB.id=q;
render();
</script>
</body>
</html>
