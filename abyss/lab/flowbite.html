<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>순위 도감 · Flowbite 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="flowbite.css">
<link rel="stylesheet" href="lab.css">
<style>body{font-family:'Pretendard',system-ui,sans-serif}.lab-wrap h1{letter-spacing:-.025em}</style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white">
<nav class="bg-white border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700">
  <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-3 sm:px-8">
    <span class="flex items-center gap-3 text-xl font-semibold whitespace-nowrap">Geogl3 Abyss
      <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded-sm dark:bg-blue-900 dark:text-blue-300">Flowbite 시안</span></span>
    <div class="flex items-center gap-2">
      <a href="index.html" class="text-sm font-medium text-blue-700 hover:underline dark:text-blue-500">다른 시안 보기</a>
      <button id="theme" type="button" class="text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-4 focus:ring-gray-200 rounded-lg text-sm p-2.5 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-700" aria-label="테마">◐</button>
    </div>
  </div>
</nav>
<main class="lab-wrap">
  <h1 class="text-3xl font-extrabold">순위 도감</h1>
  <p class="lab-lead text-gray-500 dark:text-gray-400">항목마다 자료를 가진 나라를 끝까지 줄 세웁니다. 대륙 카드를 누르면 그 대륙만 남습니다.</p>
  <div id="cats" class="lab-chips"></div>
  <div class="lab-grid">
    <aside class="lab-side" id="metrics"></aside>
    <section id="view"></section>
  </div>
</main>
<script src="../js/data.js"></script>
<script src="../js/dict-data.js"></script>
<script src="../js/climate-data.js"></script>
<script src="../js/rivers-data.js"></script>
<script src="../js/borders-data.js"></script>
<script src="../js/terr-data.js"></script>
<script src="../js/world-data.js"></script>
<script src="../js/labels.js"></script>
<script src="../js/stat-data.js"></script>
<script src="lab.js"></script>
<script src="../js/derive.js"></script>
<script>
function render(){
  const cats=[['','전체']].concat(labCats().map(c=>[c,c]));
  document.getElementById('cats').innerHTML=cats.map(([k,n])=>{
    const on=LAB.cat===k;
    return '<button type="button" data-c="'+abEsc(k)+'" class="px-4 py-2 text-sm font-medium rounded-full border focus:z-10 focus:ring-4 focus:outline-none '
      +(on?'text-white bg-blue-700 border-blue-700 hover:bg-blue-800 focus:ring-blue-300 dark:bg-blue-600 dark:border-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800'
          :'text-gray-900 bg-white border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:ring-gray-100 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700 dark:focus:ring-gray-700')
      +'">'+abEsc(n)+'</button>';}).join('');
  let h='<div class="text-sm font-medium bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700 p-2">',cur='';
  labMetrics().forEach(m=>{
    if(m.cat!==cur){cur=m.cat;h+='<div class="px-3 pt-3 pb-1 text-xs font-semibold text-gray-500 dark:text-gray-400">'+abEsc(cur)+'</div>';}
    const on=m.id===LAB.id;
    h+='<button type="button" data-id="'+abEsc(m.id)+'" class="flex items-center justify-between w-full px-3 py-2 text-left rounded-lg '
      +(on?'text-white bg-blue-700 dark:bg-blue-600':'text-gray-900 hover:bg-gray-100 hover:text-blue-700 dark:text-white dark:hover:bg-gray-700')+'">'
      +'<span>'+abEsc(m.name)+'</span><span class="text-xs '+(on?'text-blue-100':'text-gray-500 dark:text-gray-400')+'">'+abRank(m.id).length+'</span></button>';
  });
  document.getElementById('metrics').innerHTML=h+'</div>';
  const d=labData();
  let v='<div class="lab-head"><h2 class="text-2xl font-bold">'+abEsc(d.m.name)+'</h2>'
    +'<span class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded-sm dark:bg-gray-700 dark:text-gray-300">'+abEsc(d.m.src)+' · '+d.total+'개국</span></div>';
  if(d.m.note)v+='<p class="lab-note text-gray-500 dark:text-gray-400">'+abEsc(d.m.note)+'</p>';
  v+='<div class="lab-regions">'+d.cards.map(c=>
    '<div role="button" tabindex="0" data-cont="'+c.k+'"'+(c.off?' aria-disabled="true"':'')+' class="lab-reg block p-4 bg-white border rounded-lg shadow-sm hover:bg-gray-50 dark:bg-gray-800 dark:hover:bg-gray-700 '
    +(c.on?'border-blue-600 ring-2 ring-blue-600 dark:border-blue-500 dark:ring-blue-500':'border-gray-200 dark:border-gray-700')+'">'
    +'<div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">'+(c.color?'<span class="inline-block w-2.5 h-2.5 rounded-full" style="background:'+c.color+'"></span>':'')+abEsc(c.name)+'</div>'
    +'<div class="v mt-1 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">'+abEsc(c.val)+'</div><div class="s text-gray-500 dark:text-gray-400">'+abEsc(c.sub)+'</div></div>').join('')+'</div>';
  v+='<div class="relative overflow-x-auto shadow-md rounded-lg lab-scroll"><table class="lab-tbl w-full text-sm text-left text-gray-500 dark:text-gray-400"><thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"><tr>'
    +'<th class="px-6 py-3">순위</th><th class="px-6 py-3">나라</th><th class="px-6 py-3 text-right">'+abEsc(d.m.unit||'')+'</th><th class="bar px-6 py-3"></th></tr></thead><tbody>'
    +d.rows.map(r=>'<tr class="bg-white border-b border-gray-200 hover:bg-gray-50 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-600">'
      +'<td class="px-6 py-3 font-medium text-gray-900 dark:text-white">'+(r.rank<=3?'<span class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded-sm dark:bg-blue-900 dark:text-blue-300">'+r.rank+'</span>':r.rank)+'</td>'
      +'<td class="nm px-6 py-3 text-gray-900 dark:text-white"><a href="../index.html#/atlas?'+r.iso+'">'+abFlag(r.iso,18)+abEsc(r.name)+'</a></td>'
      +'<td class="val px-6 py-3">'+abEsc(r.val)+'</td>'
      +'<td class="bar px-6 py-3"><div class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700"><div class="h-2.5 rounded-full" style="width:'+r.pct.toFixed(1)+'%;background:'+r.color+'"></div></div></td></tr>').join('')
    +'</tbody></table></div>';
  document.getElementById('view').innerHTML=v;
}
document.addEventListener('click',e=>{
  const c=e.target.closest('#cats [data-c]');if(c){LAB.cat=c.dataset.c;render();return;}
  const m=e.target.closest('#metrics [data-id]');if(m){LAB.id=m.dataset.id;render();return;}
  const r=e.target.closest('.lab-reg');if(r&&r.getAttribute('aria-disabled')!=='true'){LAB.cont=r.dataset.cont;render();}
});
document.getElementById('theme').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));
const q=location.hash.replace('#','');if(q&&AB_METRICS.some(m=>m.id===q))LAB.id=q;
render();
</script>
</body>
</html>
