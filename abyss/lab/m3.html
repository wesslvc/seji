<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>순위 도감 · Material 3 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="m3-scheme.css">
<link rel="stylesheet" href="lab.css">
<script type="module" src="m3.bundle.js"></script>
<style>
  :root{
    --md-ref-typeface-brand:'Pretendard',system-ui,sans-serif;--md-ref-typeface-plain:'Pretendard',system-ui,sans-serif;
    --m3-low:color-mix(in srgb,var(--md-sys-color-surface) 93%,var(--md-sys-color-primary));
    --m3-mid:color-mix(in srgb,var(--md-sys-color-surface) 88%,var(--md-sys-color-primary));
    --m3-high:color-mix(in srgb,var(--md-sys-color-surface) 83%,var(--md-sys-color-primary));
  }
  body{background:var(--md-sys-color-background);color:var(--md-sys-color-on-background);font-family:var(--md-ref-typeface-plain)}
  .bar-top{display:flex;align-items:center;gap:.6rem;padding:.7rem clamp(1rem,4vw,2rem);background:var(--m3-low)}
  .bar-top .ttl{font-size:1.35rem;font-weight:500;letter-spacing:-.01em}
  .bar-top .tag{padding:.15rem .7rem;border-radius:8px;background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container);font-size:.78rem;font-weight:600}
  .bar-top .sp{flex:1}
  .bar-top label{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--md-sys-color-on-surface-variant)}
  .lab-lead{color:var(--md-sys-color-on-surface-variant);opacity:1}
  #cats{--md-chip-set-gap:.5rem}
  md-filter-chip{--md-filter-chip-container-shape:999px;--md-filter-chip-label-text-size:.9rem}
  .lab-side{background:var(--m3-low);border-radius:28px;padding:.6rem .4rem}
  .lab-side md-list{--md-list-container-color:transparent}
  .lab-side .grp{padding:.9rem 1.1rem .3rem;font-size:.82rem;font-weight:600;letter-spacing:.02em;color:var(--md-sys-color-primary)}
  .lab-side md-list-item{--md-list-item-container-shape:999px;border-radius:999px}
  .lab-side md-list-item.on{--md-list-item-container-color:var(--md-sys-color-secondary-container);
    --md-list-item-label-text-color:var(--md-sys-color-on-secondary-container);background:var(--md-sys-color-secondary-container)}
  .lab-side .cnt{font-size:.8rem;color:var(--md-sys-color-on-surface-variant)}
  .lab-head h2{font-weight:500}
  .src{padding:.15rem .7rem;border-radius:8px;background:var(--m3-mid);font-size:.8rem;color:var(--md-sys-color-on-surface-variant)}
  .lab-reg{position:relative;border-radius:20px;background:var(--m3-low);padding:1rem 1.15rem;overflow:hidden;
    --md-elevation-level:0;transition:background .2s,box-shadow .2s}
  .lab-reg:hover{--md-elevation-level:1;background:var(--m3-mid)}
  .lab-reg.on{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
  .lab-reg>*{height:auto}
  .lab-reg{display:block;height:auto;min-height:100%}
  .lab-reg .k{font-size:.85rem;display:flex;align-items:center;gap:.45rem;color:inherit;opacity:.85}
  .lab-reg .dot{width:.6rem;height:.6rem;border-radius:50%}
  .lab-reg .v{font-size:1.5rem;font-weight:500;letter-spacing:-.02em;margin:.15rem 0}
  .tblbox{background:var(--m3-low);border-radius:28px;padding:.4rem .8rem .8rem;overflow:hidden}
  .lab-tbl th{font-size:.85rem;font-weight:600;text-align:left;padding:1rem .9rem .6rem;color:var(--md-sys-color-on-surface-variant)}
  .lab-tbl td{padding:.62rem .9rem;border-top:1px solid var(--md-sys-color-outline-variant)}
  .lab-tbl tbody tr:first-child td{border-top:0}
  .lab-tbl tbody tr:hover td{background:var(--m3-mid)}
  .lab-tbl tbody tr:hover td:first-child{border-radius:16px 0 0 16px}.lab-tbl tbody tr:hover td:last-child{border-radius:0 16px 16px 0}
  .rk{display:inline-grid;place-items:center;min-width:1.7rem;height:1.7rem;border-radius:50%;font-size:.82rem;font-weight:600}
  .rk.top{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
  md-linear-progress{--md-linear-progress-track-height:8px;--md-linear-progress-active-indicator-height:8px;--md-linear-progress-track-shape:999px;
    --md-linear-progress-active-indicator-color:var(--c,var(--md-sys-color-primary));--md-linear-progress-track-color:var(--md-sys-color-surface-variant)}
</style>
</head>
<body>
<div class="bar-top">
  <span class="ttl">Geogl3 Abyss</span><span class="tag">Material 3 시안</span><span class="sp"></span>
  <md-text-button href="index.html">다른 시안 보기</md-text-button>
  <label>다크<md-switch id="theme"></md-switch></label>
</div>
<main class="lab-wrap">
  <h1>순위 도감</h1>
  <p class="lab-lead">항목마다 자료를 가진 나라를 끝까지 줄 세웁니다. 대륙 카드를 누르면 그 대륙만 남습니다.</p>
  <md-chip-set id="cats" style="margin-bottom:1.4rem"></md-chip-set>
  <div class="lab-grid">
    <aside class="lab-side" id="metrics"></aside>
    <section id="view"></section>
  </div>
</main>
<script src="../js/data.js"></script>
<script src="../js/dict-data.js"></script>
<script src="../js/climate-data.js"></script>
<script src="../js/rivers-data.js"></script>
<script src="../js/borders-data.js"></script>
<script src="../js/terr-data.js"></script>
<script src="../js/world-data.js"></script>
<script src="../js/labels.js"></script>
<script src="../js/stat-data.js"></script>
<script src="lab.js"></script>
<script src="../js/derive.js"></script>
<script>
function render(){
  const cats=[['','전체']].concat(labCats().map(c=>[c,c]));
  document.getElementById('cats').innerHTML=cats.map(([k,n])=>
    '<md-filter-chip label="'+abEsc(n)+'" data-c="'+abEsc(k)+'"'+(LAB.cat===k?' selected':'')+'></md-filter-chip>').join('');
  let h='<md-list>',cur='';
  labMetrics().forEach(m=>{
    if(m.cat!==cur){cur=m.cat;h+='<div class="grp">'+abEsc(cur)+'</div>';}
    h+='<md-list-item type="button" class="'+(m.id===LAB.id?'on':'')+'" data-id="'+abEsc(m.id)+'"><div slot="headline">'+abEsc(m.name)
      +'</div><span slot="end" class="cnt">'+abRank(m.id).length+'</span></md-list-item>';
  });
  document.getElementById('metrics').innerHTML=h+'</md-list>';
  const d=labData();
  let v='<div class="lab-head"><h2>'+abEsc(d.m.name)+'</h2><span class="src">'+abEsc(d.m.src)+' · '+d.total+'개국</span></div>';
  if(d.m.note)v+='<p class="lab-note">'+abEsc(d.m.note)+'</p>';
  v+='<div class="lab-regions">'+d.cards.map(c=>
    '<div role="button" tabindex="0" class="lab-reg'+(c.on?' on':'')+'" data-cont="'+c.k+'"'+(c.off?' aria-disabled="true"':'')+'>'
    +'<md-elevation></md-elevation><md-ripple></md-ripple>'
    +'<div class="k">'+(c.color?'<span class="dot" style="background:'+c.color+'"></span>':'')+abEsc(c.name)+'</div>'
    +'<div class="v">'+abEsc(c.val)+'</div><div class="s">'+abEsc(c.sub)+'</div></div>').join('')+'</div>';
  v+='<div class="tblbox lab-scroll"><table class="lab-tbl"><thead><tr>'
    +'<th>순위</th><th>나라</th><th style="text-align:right">'+abEsc(d.m.unit||'')+'</th><th class="bar"></th></tr></thead><tbody>'
    +d.rows.map(r=>'<tr><td><span class="rk'+(r.rank<=3?' top':'')+'">'+r.rank+'</span></td>'
      +'<td class="nm"><a href="../index.html#/atlas?'+r.iso+'">'+abFlag(r.iso,20)+abEsc(r.name)+'</a></td>'
      +'<td class="val">'+abEsc(r.val)+'</td>'
      +'<td class="bar"><md-linear-progress style="--c:'+r.color+'" value="'+(r.pct/100).toFixed(3)+'"></md-linear-progress></td></tr>').join('')
    +'</tbody></table></div>';
  document.getElementById('view').innerHTML=v;
}
document.addEventListener('click',e=>{
  const c=e.target.closest('#cats [data-c]');if(c){LAB.cat=c.dataset.c;render();return;}
  const m=e.target.closest('#metrics [data-id]');if(m){LAB.id=m.dataset.id;render();return;}
  const r=e.target.closest('.lab-reg');if(r&&r.getAttribute('aria-disabled')!=='true'){LAB.cont=r.dataset.cont;render();}
});
document.getElementById('theme').addEventListener('change',e=>{
  document.documentElement.dataset.theme=e.target.selected?'dark':'light';
});
const q=location.hash.replace('#','');if(q&&AB_METRICS.some(m=>m.id===q))LAB.id=q;
render();
</script>
</body>
</html>
