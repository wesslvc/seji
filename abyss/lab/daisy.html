<!doctype html>
<html lang="ko" data-theme="cupcake">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지오글 도감 · daisyUI 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.46/daisyui.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.46/themes.css">
<link rel="stylesheet" href="lab.css">
<style>
  body{background:var(--color-base-200);color:var(--color-base-content)}
  .lab-reg.on .card{outline:2px solid var(--color-primary)}
  .lab-tbl td,.lab-tbl th{padding:.7rem .9rem}
</style>
</head>
<body>
<div class="navbar bg-base-100 shadow-sm">
  <div class="flex-1 px-2"><a class="btn btn-ghost text-lg" href="index.html">Geogl3</a>
    <span class="badge badge-primary badge-soft">daisyUI 5 · 시안</span></div>
  <div class="flex-none gap-1">
    <a class="btn btn-ghost btn-sm" href="wa.html">Web Awesome 시안 →</a>
    <label class="swap swap-rotate btn btn-ghost btn-circle btn-sm" title="테마">
      <input type="checkbox" id="theme"><span class="swap-off">☾</span><span class="swap-on">☀</span></label>
  </div>
</div>
<main class="lab-wrap">
  <h1>순위 도감</h1>
  <p class="lab-lead">항목마다 자료를 가진 나라를 끝까지 줄 세웁니다. 대륙 카드를 누르면 그 대륙만 남습니다.</p>
  <div id="cats" class="lab-chips"></div>
  <div class="lab-grid">
    <aside class="lab-side bg-base-100 rounded-box shadow-sm"><ul id="metrics" class="menu w-full"></ul></aside>
    <section id="view"></section>
  </div>
</main>
<script src="../js/data.js"></script>
<script src="../js/dict-data.js"></script>
<script src="../js/climate-data.js"></script>
<script src="../js/rivers-data.js"></script>
<script src="../js/borders-data.js"></script>
<script src="../js/terr-data.js"></script>
<script src="../js/world-data.js"></script>
<script src="../js/labels.js"></script>
<script src="../js/stat-data.js"></script>
<script src="lab.js"></script>
<script src="../js/derive.js"></script>
<script>
function render(){
  /* 분류 칩 */
  const cats=[['','전체']].concat(labCats().map(c=>[c,c]));
  document.getElementById('cats').innerHTML=cats.map(([k,n])=>
    '<button class="btn btn-sm rounded-full '+(LAB.cat===k?'btn-primary':'btn-outline')+'" data-c="'+abEsc(k)+'">'+abEsc(n)+'</button>').join('');
  /* 항목 목록 */
  let h='',cur='';
  labMetrics().forEach(m=>{
    if(m.cat!==cur){cur=m.cat;h+='<li class="menu-title">'+abEsc(cur)+'</li>';}
    h+='<li><a data-id="'+abEsc(m.id)+'" class="'+(m.id===LAB.id?'menu-active':'')+'">'+abEsc(m.name)
      +'<span class="badge badge-ghost badge-sm">'+abRank(m.id).length+'</span></a></li>';
  });
  document.getElementById('metrics').innerHTML=h;
  /* 본문 */
  const d=labData();
  let v='<div class="lab-head"><h2>'+abEsc(d.m.name)+'</h2><span class="badge badge-ghost">'+abEsc(d.m.src)+' · '+d.total+'개국</span></div>';
  if(d.m.note)v+='<p class="lab-note">'+abEsc(d.m.note)+'</p>';
  v+='<div class="lab-regions">'+d.cards.map(c=>
    '<div role="button" tabindex="0" class="lab-reg'+(c.on?' on':'')+'" data-cont="'+c.k+'"'+(c.off?' aria-disabled="true"':'')+'>'
    +'<div class="card card-sm bg-base-100 shadow-sm"><div class="card-body gap-1">'
    +'<div class="text-sm opacity-70">'+(c.color?'<span class="status" style="background:'+c.color+'"></span> ':'')+abEsc(c.name)+'</div>'
    +'<div class="v">'+abEsc(c.val)+'</div><div class="s">'+abEsc(c.sub)+'</div></div></div></div>').join('')+'</div>';
  v+='<div class="lab-scroll bg-base-100 rounded-box shadow-sm"><table class="lab-tbl table"><thead><tr>'
    +'<th>순위</th><th>나라</th><th style="text-align:right">'+abEsc(d.m.unit||'')+'</th><th class="bar"></th></tr></thead><tbody>'
    +d.rows.map(r=>'<tr class="hover"><td>'+(r.rank<=3?'<span class="badge badge-primary badge-sm">'+r.rank+'</span>':r.rank)+'</td>'
      +'<td class="nm"><a href="../index.html#/atlas?'+r.iso+'">'+abFlag(r.iso,18)+abEsc(r.name)+'</a></td>'
      +'<td class="val">'+abEsc(r.val)+'</td>'
      +'<td class="bar"><progress class="progress" style="color:'+r.color+'" value="'+r.pct.toFixed(1)+'" max="100"></progress></td></tr>').join('')
    +'</tbody></table></div>';
  document.getElementById('view').innerHTML=v;
}
document.addEventListener('click',e=>{
  const c=e.target.closest('#cats [data-c]');if(c){LAB.cat=c.dataset.c;render();return;}
  const m=e.target.closest('#metrics [data-id]');if(m){LAB.id=m.dataset.id;render();return;}
  const r=e.target.closest('.lab-reg');if(r&&r.getAttribute('aria-disabled')!=='true'){LAB.cont=r.dataset.cont;render();}
});
document.getElementById('theme').addEventListener('change',e=>{
  document.documentElement.dataset.theme=e.target.checked?'dim':'cupcake';
});
const q=location.hash.replace('#','');if(q&&AB_METRICS.some(m=>m.id===q))LAB.id=q;
render();
</script>
</body>
</html>
