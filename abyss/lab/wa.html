<!doctype html>
<html lang="ko" class="wa-theme-default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>어비스 도감 · Web Awesome 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
<link rel="stylesheet" href="lab.css">
<style>
  body{background:var(--wa-color-surface-lowered);color:var(--wa-color-text-normal);font-family:'Pretendard',var(--wa-font-family-body)}
  wa-page-placeholder{display:none}
  .top{display:flex;align-items:center;gap:.8rem;padding:.8rem clamp(1rem,4vw,2rem);background:var(--wa-color-surface-default);
    border-bottom:1px solid var(--wa-color-surface-border)}
  .top b{font-size:1.05rem;letter-spacing:-.01em}.top .sp{flex:1}
  .lab-side{background:var(--wa-color-surface-default);border:1px solid var(--wa-color-surface-border);border-radius:var(--wa-border-radius-l);padding:.5rem}
  .lab-side .grp{padding:.7rem .7rem .2rem;font-size:.78rem;font-weight:600;color:var(--wa-color-text-quiet)}
  .lab-side button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;
    color:inherit;font:inherit;padding:.55rem .75rem;border-radius:var(--wa-border-radius-m);cursor:pointer}
  .lab-side button:hover{background:var(--wa-color-surface-lowered)}
  .lab-side button.on{background:var(--wa-color-brand-fill-quiet);color:var(--wa-color-brand-on-quiet);font-weight:600}
  wa-card.reg{--spacing:.9rem;width:100%}
  .lab-reg.on wa-card{outline:2px solid var(--wa-color-brand-fill-loud);outline-offset:-1px}
  .tblbox{background:var(--wa-color-surface-default);border:1px solid var(--wa-color-surface-border);border-radius:var(--wa-border-radius-l);overflow:hidden}
  .lab-tbl th{font-size:.85rem;font-weight:600;color:var(--wa-color-text-quiet);text-align:left;padding:.8rem .9rem;border-bottom:1px solid var(--wa-color-surface-border)}
  .lab-tbl td{padding:.7rem .9rem;border-bottom:1px solid var(--wa-color-surface-border)}
  .lab-tbl tr:last-child td{border-bottom:0}
  .lab-tbl tbody tr:hover td{background:var(--wa-color-surface-lowered)}
  wa-progress-bar{--track-height:.5rem}
</style>
</head>
<body>
<div class="top">
  <b>Geogl3 Abyss</b><wa-badge variant="brand" appearance="filled-outlined">Web Awesome 시안</wa-badge>
  <span class="sp"></span>
  <wa-button size="small" appearance="plain" href="daisy.html">daisyUI 시안 →</wa-button>
  <wa-switch id="theme" size="small">다크</wa-switch>
</div>
<main class="lab-wrap">
  <h1>순위 도감</h1>
  <p class="lab-lead">항목마다 자료를 가진 나라를 끝까지 줄 세웁니다. 대륙 카드를 누르면 그 대륙만 남습니다.</p>
  <div id="cats" class="lab-chips"></div>
  <div class="lab-grid">
    <aside class="lab-side" id="metrics"></aside>
    <section id="view"></section>
  </div>
</main>
<script src="../js/data.js"></script>
<script src="../js/dict-data.js"></script>
<script src="../js/climate-data.js"></script>
<script src="../js/rivers-data.js"></script>
<script src="../js/borders-data.js"></script>
<script src="../js/terr-data.js"></script>
<script src="../js/world-data.js"></script>
<script src="../js/labels.js"></script>
<script src="../js/stat-data.js"></script>
<script src="lab.js"></script>
<script src="../js/derive.js"></script>
<script>
function render(){
  const cats=[['','전체']].concat(labCats().map(c=>[c,c]));
  document.getElementById('cats').innerHTML=cats.map(([k,n])=>
    '<wa-button size="small" pill appearance="'+(LAB.cat===k?'filled':'outlined')+'" variant="'+(LAB.cat===k?'brand':'neutral')
    +'" data-c="'+abEsc(k)+'">'+abEsc(n)+'</wa-button>').join('');
  let h='',cur='';
  labMetrics().forEach(m=>{
    if(m.cat!==cur){cur=m.cat;h+='<div class="grp">'+abEsc(cur)+'</div>';}
    h+='<button data-id="'+abEsc(m.id)+'" class="'+(m.id===LAB.id?'on':'')+'"><span>'+abEsc(m.name)+'</span>'
      +'<wa-badge appearance="outlined" variant="neutral">'+abRank(m.id).length+'</wa-badge></button>';
  });
  document.getElementById('metrics').innerHTML=h;
  const d=labData();
  let v='<div class="lab-head"><h2>'+abEsc(d.m.name)+'</h2><wa-badge appearance="outlined" variant="neutral">'+abEsc(d.m.src)+' · '+d.total+'개국</wa-badge></div>';
  if(d.m.note)v+='<p class="lab-note">'+abEsc(d.m.note)+'</p>';
  v+='<div class="lab-regions">'+d.cards.map(c=>
    '<div role="button" tabindex="0" class="lab-reg'+(c.on?' on':'')+'" data-cont="'+c.k+'"'+(c.off?' aria-disabled="true"':'')+'><wa-card class="reg" appearance="outlined">'
    +'<div style="font-size:.85rem;color:var(--wa-color-text-quiet)">'+(c.color?'<span style="display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:'+c.color+'"></span> ':'')+abEsc(c.name)+'</div>'
    +'<div class="v">'+abEsc(c.val)+'</div><div class="s">'+abEsc(c.sub)+'</div></wa-card></div>').join('')+'</div>';
  v+='<div class="tblbox lab-scroll"><table class="lab-tbl"><thead><tr>'
    +'<th>순위</th><th>나라</th><th style="text-align:right">'+abEsc(d.m.unit||'')+'</th><th class="bar"></th></tr></thead><tbody>'
    +d.rows.map(r=>'<tr><td>'+(r.rank<=3?'<wa-badge variant="brand" pill>'+r.rank+'</wa-badge>':r.rank)+'</td>'
      +'<td class="nm"><a href="../index.html#/atlas?'+r.iso+'">'+abFlag(r.iso,18)+abEsc(r.name)+'</a></td>'
      +'<td class="val">'+abEsc(r.val)+'</td>'
      +'<td class="bar"><wa-progress-bar value="'+r.pct.toFixed(1)+'" style="--indicator-color:'+r.color+'"></wa-progress-bar></td></tr>').join('')
    +'</tbody></table></div>';
  document.getElementById('view').innerHTML=v;
}
document.addEventListener('click',e=>{
  const c=e.target.closest('#cats [data-c]');if(c){LAB.cat=c.dataset.c;render();return;}
  const m=e.target.closest('#metrics [data-id]');if(m){LAB.id=m.dataset.id;render();return;}
  const r=e.target.closest('.lab-reg');if(r&&r.getAttribute('aria-disabled')!=='true'){LAB.cont=r.dataset.cont;render();}
});
document.getElementById('theme').addEventListener('change',e=>{
  document.documentElement.classList.toggle('wa-dark',e.target.checked);
});
const q=location.hash.replace('#','');if(q&&AB_METRICS.some(m=>m.id===q))LAB.id=q;
render();
</script>
</body>
</html>
