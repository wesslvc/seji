<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geogl3 여행 동선</title>
<meta name="description" content="허브 공항에서 일본까지, 도시 순서와 하루 동선을 지도 위에서 짜고 이동 시간·거리·교통비를 한눈에 보는 여행 계획 도구">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="trip.css?v=2">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header class="top">
      <div class="brand"><span class="logo" aria-hidden="true">✈︎</span><div><h1>일본 여행 동선</h1><p>노선 · 도시 순서 · 하루 동선을 한 지도에서</p></div></div>
      <button id="hub-btn" class="hub" title="내 허브 공항">
        <span class="hub-k">내 허브</span><b id="hub-code">ICN</b><span id="hub-name">인천</span>
      </button>
    </header>
    <div id="hub-pop" class="pop" hidden></div>

    <section class="card">
      <h2><span class="n">1</span>출발일</h2>
      <label>여행 시작일<input type="date" id="f-start"></label>
    </section>

    <section class="card">
      <h2><span class="n">2</span>항공편 <small>허브에서 직항 · 편명과 시각대로 일정이 움직여요</small></h2>
      <div class="grid2">
        <label>들어가는 공항<select id="f-in"></select></label>
        <label>나오는 공항<select id="f-out"></select></label>
      </div>
      <div id="air-info" class="air"></div>
    </section>

    <section class="card">
      <h2><span class="n">3</span>도시 순서</h2>
      <ol id="stops" class="stops"></ol>
      <div class="add-row">
        <select id="f-addcity"><option value="">+ 도시 추가</option></select>
      </div>
    </section>

    <section class="card">
      <h2><span class="n">4</span>하루 동선</h2>
      <div id="day-tabs" class="tabs" role="tablist"></div>
      <div id="day-body"></div>
    </section>

    <p class="note">이동 경로·시각은 대중교통 시간표 기준(Transitous)이고, 요금은 추정치입니다. 실제 운임과 운항은 출발 전에 확인하세요.<br>지도 © OpenStreetMap 기여자 · OpenFreeMap · 경로 Transitous<br><a href="/geogl3/for2027csat/">지난 서비스: Geogl3 (2027 수능 세계지리)</a></p>
    <div id="sum" class="sum"></div>
  </aside>
  <main id="map" aria-label="지도"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data-cities.js?v=2"></script>
<script src="data-routes.js?v=2"></script>
<script src="trip.js?v=2"></script>
</body>
</html>
